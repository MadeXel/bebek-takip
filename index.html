<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Bebek Takip</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="theme-color" content="#141a2b" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Bebek Takip" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');
  :root{
    --bg:#141a2b; --surface:#1e2740; --surface-2:#26314f; --line:#333f5e;
    --text:#eef0f7; --text-muted:#8b93ac;
    --milk:#f6c453; --milk-soft:#4a4227;
    --formula:#7ec8e3; --formula-soft:#213c47;
    --pump:#c9a6f2; --pump-soft:#332a4d;
    --pee:#8fd3f4; --pee-soft:#1d3a4a;
    --poop:#c99a6a; --poop-soft:#3f2f22;
    --care:#9be3b0; --care-soft:#1f3a2a;
    --danger:#e37676;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);}
  body{font-family:'Inter',sans-serif;color:var(--text);padding-bottom:env(safe-area-inset-bottom);}
  .wrap{min-height:100vh;padding:16px 14px 90px;max-width:480px;margin:0 auto;}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .moon{font-size:22px;}
  h1{font-family:'Quicksand',sans-serif;font-size:18px;font-weight:700;margin:0;letter-spacing:.2px;}
  .sub{color:var(--text-muted);font-size:12px;margin-top:2px;}
  .iconbtn{background:var(--surface);border:none;color:var(--text-muted);width:34px;height:34px;border-radius:10px;font-size:15px;cursor:pointer;}
  .topRight{display:flex;gap:6px;}
  .connbadge{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-muted);}
  .connbadge .pulse{width:7px;height:7px;border-radius:50%;background:#5fd07a;}
  .connbadge.offline .pulse{background:var(--danger);}

  .reminders{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
  .reminder{background:#3a2f1e;color:#f4d9a6;border-radius:12px;padding:9px 12px;font-size:12.5px;display:flex;align-items:center;gap:8px;}

  .tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:6px 10px calc(6px + env(safe-area-inset-bottom));max-width:480px;margin:0 auto;}
  .tabbtn{flex:1;background:none;border:none;color:var(--text-muted);font-family:'Quicksand',sans-serif;font-weight:600;font-size:11px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border-radius:10px;}
  .tabbtn .ic{font-size:18px;}
  .tabbtn.active{color:var(--text);background:var(--surface-2);}

  .datebar{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:14px;padding:8px 10px;margin-bottom:14px;}
  .datebar button{background:none;border:none;color:var(--text);font-size:16px;padding:6px 10px;cursor:pointer;border-radius:10px;}
  .datebar button:active{background:var(--surface-2);}
  .datelabel{font-family:'Quicksand',sans-serif;font-weight:600;font-size:14px;}
  .today-pill{font-size:11px;color:var(--text-muted);cursor:pointer;text-decoration:underline;}

  .summary{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
  .scard{background:var(--surface);border-radius:14px;padding:10px 12px;}
  .scard .label{font-size:11px;color:var(--text-muted);margin-bottom:3px;}
  .scard .val{font-family:'Quicksand',sans-serif;font-weight:700;font-size:14.5px;}
  .scard.wide{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;}

  .actions{display:grid;gap:8px;margin-bottom:14px;}
  .actions.cols3{grid-template-columns:1fr 1fr 1fr;}
  .actions.cols2{grid-template-columns:1fr 1fr;}
  .actions.cols4{grid-template-columns:1fr 1fr 1fr 1fr;}
  .abtn{border:none;border-radius:14px;padding:12px 4px;font-family:'Quicksand',sans-serif;font-weight:600;font-size:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--text);position:relative;}
  .abtn .ic{font-size:18px;}
  .abtn.milk{background:var(--milk-soft);} .abtn.formula{background:var(--formula-soft);} .abtn.pump{background:var(--pump-soft);}
  .abtn.pee{background:var(--pee-soft);} .abtn.poop{background:var(--poop-soft);} .abtn.both{background:linear-gradient(135deg,var(--pee-soft),var(--poop-soft));}
  .abtn.care{background:var(--care-soft);}
  .abtn:active{transform:scale(0.97);}
  .abtn .doneToday{position:absolute;top:6px;right:8px;font-size:10px;color:var(--care);font-family:'Inter',sans-serif;}
  .abtn.overdue{outline:2px solid #e3a876;}

  .panel{background:var(--surface);border-radius:16px;padding:14px;margin-bottom:14px;border:1px solid var(--line);}
  .panel .ptitle{font-family:'Quicksand',sans-serif;font-weight:700;font-size:14px;margin-bottom:10px;}
  .field{margin-bottom:10px;}
  .field label{display:block;font-size:11.5px;color:var(--text-muted);margin-bottom:4px;}
  .field input,.field select{width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 10px;font-size:14px;font-family:'Inter',sans-serif;}
  .field input:focus{outline:2px solid var(--formula);outline-offset:1px;}
  .prow{display:flex;gap:8px;}
  .prow .field{flex:1;}
  .pactions{display:flex;gap:8px;margin-top:4px;}
  .pactions button{flex:1;border:none;border-radius:10px;padding:10px;font-family:'Quicksand',sans-serif;font-weight:700;font-size:13px;cursor:pointer;}
  .save-btn{background:var(--text);color:var(--bg);}
  .cancel-btn{background:var(--surface-2);color:var(--text-muted);}
  .delete-btn{background:#3a2222;color:var(--danger);}

  .timeline{display:flex;flex-direction:column;gap:8px;}
  .tlabel{font-size:11.5px;color:var(--text-muted);margin:6px 2px 2px;}
  .entry{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:14px;padding:10px 12px;}
  .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .dot.milk{background:var(--milk);} .dot.formula{background:var(--formula);} .dot.pump{background:var(--pump);}
  .dot.pee{background:var(--pee);} .dot.poop{background:var(--poop);} .dot.both{background:linear-gradient(135deg,var(--pee),var(--poop));}
  .dot.care{background:var(--care);}
  .einfo{flex:1;min-width:0;}
  .etype{font-family:'Quicksand',sans-serif;font-weight:600;font-size:13px;}
  .etime{font-size:11.5px;color:var(--text-muted);}
  .eamt{font-family:'Quicksand',sans-serif;font-weight:700;font-size:13.5px;white-space:nowrap;}
  .erow-actions{display:flex;gap:2px;}
  .eedit,.edel{background:none;border:none;color:var(--text-muted);font-size:15px;padding:4px 6px;cursor:pointer;}
  .empty{text-align:center;color:var(--text-muted);font-size:13px;padding:26px 10px;}
  .note{font-size:11px;color:var(--text-muted);text-align:center;margin-top:16px;line-height:1.5;}
  .configwarn{background:#4a2727;color:#f2b8b8;border-radius:12px;padding:12px;font-size:12.5px;line-height:1.6;margin-bottom:16px;}

  .growthList{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
  .chartbox{background:var(--surface);border-radius:14px;padding:14px 10px;margin-bottom:14px;}
  .chartTitle{font-size:11.5px;color:var(--text-muted);margin-bottom:8px;padding-left:4px;}

  .careRow{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:14px;padding:12px;margin-bottom:8px;}
  .careRow .left{display:flex;align-items:center;gap:10px;}
  .careRow .ic{font-size:20px;}
  .careRow .ctitle{font-family:'Quicksand',sans-serif;font-weight:600;font-size:13.5px;}
  .careRow .cmeta{font-size:11px;color:var(--text-muted);}
  .logbtn{background:var(--care-soft);color:var(--care);border:none;border-radius:10px;padding:8px 12px;font-family:'Quicksand',sans-serif;font-weight:700;font-size:12px;cursor:pointer;}
</style>
</head>
<body>

<div class="wrap" id="loginScreen" style="display:none;">
  <div class="top"><div class="brand"><div class="moon">🌙</div><div><h1>Bebek Takip</h1><div class="sub">Devam etmek için şifre girin</div></div></div></div>
  <div class="panel">
    <div class="field"><label>Şifre</label><input type="password" id="pinInput" placeholder="••••••••" autocomplete="current-password" /></div>
    <div id="loginError" style="color:#f2b8b8;font-size:12.5px;margin-bottom:10px;display:none;">Şifre yanlış, tekrar deneyin.</div>
    <div class="pactions"><button class="save-btn" id="loginBtn" style="flex:1;">Giriş yap</button></div>
  </div>
</div>

<div class="wrap" id="appScreen" style="display:none;">
  <div class="top">
    <div class="brand">
      <div class="moon">🌙</div>
      <div><h1>Bebek Takip</h1><div class="sub" id="loadingNote">Bağlanılıyor…</div></div>
    </div>
    <div class="topRight">
      <button class="iconbtn" id="exportBtn" title="Yedek indir">⬇</button>
      <div class="connbadge offline" id="connBadge"><div class="pulse"></div><span id="connText">Bağlanıyor</span></div>
    </div>
  </div>

  <div id="configWarn" class="configwarn" style="display:none;">⚠️ Supabase yapılandırması eksik.</div>

  <div class="reminders" id="reminders"></div>

  <div id="tabContent"></div>
</div>

<div class="tabbar" id="tabbar" style="display:none;">
  <button class="tabbtn" data-tab="feed"><span class="ic">🍼</span>Beslenme</button>
  <button class="tabbtn" data-tab="diaper"><span class="ic">🧷</span>Bez</button>
  <button class="tabbtn" data-tab="care"><span class="ic">💧</span>Bakım</button>
  <button class="tabbtn" data-tab="growth"><span class="ic">📈</span>Büyüme</button>
</div>

<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

  const SUPABASE_URL = "https://mqsrnkzdfzstznfqflso.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_2yIWU2OZOqhKoXORpO5_9g_rzey2_9z";
  const SHARED_LOGIN_EMAIL = "aile@bebektakip.app";
  const VAPID_PUBLIC_KEY = "BJZkyQ1h6ATndhytyv-MwjU4YSiWxF3wyiROm6IwREzDEguikK1MAwx1poklTCARspIURcBb4urk_y88BrBPJbA";
  const isConfigured = !!(SUPABASE_URL && SUPABASE_ANON_KEY);
  if(!isConfigured) document.getElementById('configWarn').style.display = 'block';

  function urlBase64ToUint8Array(base64String){
    const padding = '='.repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const rawData = window.atob(base64);
    const outputArray = new Uint8Array(rawData.length);
    for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
    return outputArray;
  }

  async function setupPushNotifications(){
    if(!('serviceWorker' in navigator) || !('PushManager' in window)) return;
    try{
      const reg = await navigator.serviceWorker.register('sw.js');
      if(Notification.permission === 'default'){
        await Notification.requestPermission();
      }
      if(Notification.permission !== 'granted') return;
      let sub = await reg.pushManager.getSubscription();
      if(!sub){
        sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
        });
      }
      const json = sub.toJSON();
      await supabase.from('push_subscriptions').upsert(
        { endpoint: json.endpoint, p256dh: json.keys.p256dh, auth: json.keys.auth },
        { onConflict: 'endpoint' }
      );
    }catch(err){ console.error('Push kurulum hatası', err); }
  }

  // ---------- helpers ----------
  function fmtDate(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
  function dateLabelFor(dateStr){
    const today = fmtDate(new Date());
    const y = new Date(); y.setDate(y.getDate()-1);
    const yesterday = fmtDate(y);
    const d = new Date(dateStr+'T00:00:00');
    let base = d.toLocaleDateString('tr-TR', {day:'numeric', month:'long', weekday:'long'});
    if(dateStr===today) return 'Bugün · '+base;
    if(dateStr===yesterday) return 'Dün · '+base;
    return base;
  }
  function timeStr(iso){ return new Date(iso).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}); }
  function agoStr(iso){
    const mins = Math.floor((Date.now() - new Date(iso).getTime())/60000);
    if(mins < 1) return 'az önce';
    if(mins < 60) return mins+' dk önce';
    const h = Math.floor(mins/60), m = mins%60;
    return h+' sa'+(m?' '+m+' dk':'')+' önce';
  }
  function hoursAgo(iso){ return (Date.now() - new Date(iso).getTime())/3600000; }
  function nowLocalInputValue(){ const d = new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16); }
  function todayStr(){ return fmtDate(new Date()); }
  function isToday(iso){ return iso.slice(0,10) === todayStr(); }
  function el(id){ return document.getElementById(id); }

  // ---------- state ----------
  let entries = [], diapers = [], careLogs = [], growth = [], settings = {};
  let activeTab = 'feed';
  let selectedDate = { feed: fmtDate(new Date()), diaper: fmtDate(new Date()) };
  let openPanel = null;      // {section, type, editingId}
  let notified = {};          // dedupe local notifications per key

  const FEED_META = { milk:{label:'Anne Sütü',dot:'milk',ic:'🤱'}, formula:{label:'Mama',dot:'formula',ic:'🍼'}, pump:{label:'Sağma',dot:'pump',ic:'🫙'} };
  const DIAPER_META = { pee:{label:'Çiş',dot:'pee',ic:'💧'}, poop:{label:'Kaka',dot:'poop',ic:'💩'}, both:{label:'İkisi de',dot:'both',ic:'🧷'} };
  const CARE_META = {
    vitamin_d:{label:'Vitamin D', ic:'☀️', settingKey:'reminder_vitamin_d_time'},
    eye_drops:{label:'Göz Damlası', ic:'👁️', settingKey:'reminder_eye_drops_time'},
    nose_drops:{label:'Burun Damlası', ic:'💦', settingKey:'reminder_nose_drops_time'},
    nose_cleaning:{label:'Burun Temizliği', ic:'🧼', settingKey:null},
  };

  // ================= RENDER: TABS =================
  function renderTabbar(){
    document.querySelectorAll('.tabbtn').forEach(b=>{
      b.classList.toggle('active', b.dataset.tab === activeTab);
    });
  }

  function render(){
    renderTabbar();
    renderReminders();
    const host = el('tabContent');
    if(activeTab==='feed') host.innerHTML = tplFeed();
    else if(activeTab==='diaper') host.innerHTML = tplDiaper();
    else if(activeTab==='care') host.innerHTML = tplCare();
    else if(activeTab==='growth') host.innerHTML = tplGrowth();
    wireTabEvents();
  }

  // ================= FEED TAB =================
  function tplFeed(){
    const dateStr = selectedDate.feed;
    const dayEntries = entries.filter(e=>e.time.slice(0,10)===dateStr).sort((a,b)=> new Date(b.time)-new Date(a.time));
    const totalMilk = dayEntries.filter(e=>e.type==='milk').reduce((s,e)=>s+e.amount,0);
    const totalFormula = dayEntries.filter(e=>e.type==='formula').reduce((s,e)=>s+e.amount,0);
    const totalPump = dayEntries.filter(e=>e.type==='pump').reduce((s,e)=>s+e.amount,0);
    const allSorted = [...entries].sort((a,b)=> new Date(b.time)-new Date(a.time));
    const lastFeed = allSorted.find(e=>e.type==='milk'||e.type==='formula');
    const lastPump = allSorted.find(e=>e.type==='pump');

    return `
      <div class="datebar">
        <button data-act="prevDate" data-section="feed">‹</button>
        <div><div class="datelabel">${dateLabelFor(dateStr)}</div>${dateStr!==todayStr()?`<div class="today-pill" data-act="today" data-section="feed">bugüne dön</div>`:''}</div>
        <button data-act="nextDate" data-section="feed">›</button>
      </div>
      <div class="summary">
        <div class="scard wide">
          <div><div class="label">Son beslenme</div><div class="val">${lastFeed?agoStr(lastFeed.time):'—'}</div></div>
          <div style="text-align:right;"><div class="label">Son sağma</div><div class="val">${lastPump?agoStr(lastPump.time):'—'}</div></div>
        </div>
        <div class="scard"><div class="label">Anne sütü (gün)</div><div class="val">${totalMilk} cc</div></div>
        <div class="scard"><div class="label">Mama (gün)</div><div class="val">${totalFormula} cc</div></div>
        <div class="scard wide"><div class="label">Sağılan (gün)</div><div class="val">${totalPump} cc</div></div>
      </div>
      <div class="actions cols3">
        <button class="abtn milk" data-act="openFeed" data-type="milk"><span class="ic">🤱</span>Anne Sütü</button>
        <button class="abtn formula" data-act="openFeed" data-type="formula"><span class="ic">🍼</span>Mama</button>
        <button class="abtn pump" data-act="openFeed" data-type="pump"><span class="ic">🫙</span>Sağma</button>
      </div>
      <div id="panelHost">${openPanel && openPanel.section==='feed' ? panelFeed() : ''}</div>
      <div class="timeline">${dayEntries.length===0 ? `<div class="empty">Bu gün için kayıt yok.</div>` :
        `<div class="tlabel">Gün içindeki kayıtlar</div>` + dayEntries.map(e=>{
          const m = FEED_META[e.type];
          return `<div class="entry">
            <div class="dot ${m.dot}"></div>
            <div class="einfo"><div class="etype">${m.label}</div><div class="etime">${timeStr(e.time)} · ${agoStr(e.time)}</div></div>
            <div class="eamt">${e.amount} cc</div>
            <div class="erow-actions">
              <button class="eedit" data-act="editFeed" data-id="${e.id}">✎</button>
              <button class="edel" data-act="delFeed" data-id="${e.id}">✕</button>
            </div>
          </div>`;
        }).join('')}
      </div>`;
  }
  function panelFeed(){
    const editing = openPanel.editingId ? entries.find(e=>e.id===openPanel.editingId) : null;
    const type = openPanel.type;
    const m = FEED_META[type];
    const amt = editing ? editing.amount : '';
    const timeVal = editing ? new Date(new Date(editing.time).getTime() - new Date(editing.time).getTimezoneOffset()*60000).toISOString().slice(0,16) : nowLocalInputValue();
    return `<div class="panel">
      <div class="ptitle">${m.label} ${editing?'düzenle':'kaydı ekle'}</div>
      <div class="prow">
        <div class="field"><label>Miktar (cc)</label><input type="number" id="amtInput" min="0" step="5" value="${amt}" placeholder="ör. 60" /></div>
        <div class="field"><label>Saat</label><input type="datetime-local" id="timeInput" value="${timeVal}" /></div>
      </div>
      <div class="pactions">
        <button class="cancel-btn" data-act="closePanel">Vazgeç</button>
        ${editing?`<button class="delete-btn" data-act="delFeed" data-id="${editing.id}">Sil</button>`:''}
        <button class="save-btn" data-act="saveFeed">Kaydet</button>
      </div>
    </div>`;
  }

  // ================= DIAPER TAB =================
  function tplDiaper(){
    const dateStr = selectedDate.diaper;
    const dayEntries = diapers.filter(d=>d.time.slice(0,10)===dateStr).sort((a,b)=> new Date(b.time)-new Date(a.time));
    const peeCount = dayEntries.filter(d=>d.kind==='pee'||d.kind==='both').length;
    const poopCount = dayEntries.filter(d=>d.kind==='poop'||d.kind==='both').length;
    const last = [...diapers].sort((a,b)=> new Date(b.time)-new Date(a.time))[0];
    return `
      <div class="datebar">
        <button data-act="prevDate" data-section="diaper">‹</button>
        <div><div class="datelabel">${dateLabelFor(dateStr)}</div>${dateStr!==todayStr()?`<div class="today-pill" data-act="today" data-section="diaper">bugüne dön</div>`:''}</div>
        <button data-act="nextDate" data-section="diaper">›</button>
      </div>
      <div class="summary">
        <div class="scard wide"><div><div class="label">Son değişim</div><div class="val">${last?agoStr(last.time):'—'}</div></div></div>
        <div class="scard"><div class="label">Çiş (gün)</div><div class="val">${peeCount}</div></div>
        <div class="scard"><div class="label">Kaka (gün)</div><div class="val">${poopCount}</div></div>
      </div>
      <div class="actions cols3">
        <button class="abtn pee" data-act="quickDiaper" data-kind="pee"><span class="ic">💧</span>Çiş</button>
        <button class="abtn poop" data-act="quickDiaper" data-kind="poop"><span class="ic">💩</span>Kaka</button>
        <button class="abtn both" data-act="quickDiaper" data-kind="both"><span class="ic">🧷</span>İkisi de</button>
      </div>
      <div id="panelHost">${openPanel && openPanel.section==='diaper' ? panelDiaper() : ''}</div>
      <div class="timeline">${dayEntries.length===0 ? `<div class="empty">Bu gün için kayıt yok.</div>` :
        `<div class="tlabel">Gün içindeki kayıtlar</div>` + dayEntries.map(d=>{
          const m = DIAPER_META[d.kind];
          return `<div class="entry">
            <div class="dot ${m.dot}"></div>
            <div class="einfo"><div class="etype">${m.label}</div><div class="etime">${timeStr(d.time)} · ${agoStr(d.time)}</div></div>
            <div class="erow-actions">
              <button class="eedit" data-act="editDiaper" data-id="${d.id}">✎</button>
              <button class="edel" data-act="delDiaper" data-id="${d.id}">✕</button>
            </div>
          </div>`;
        }).join('')}
      </div>`;
  }
  function panelDiaper(){
    const editing = openPanel.editingId ? diapers.find(d=>d.id===openPanel.editingId) : null;
    const kind = editing ? editing.kind : openPanel.kind;
    const timeVal = editing ? new Date(new Date(editing.time).getTime() - new Date(editing.time).getTimezoneOffset()*60000).toISOString().slice(0,16) : nowLocalInputValue();
    return `<div class="panel">
      <div class="ptitle">${DIAPER_META[kind].label} ${editing?'düzenle':'kaydı'}</div>
      <div class="prow">
        <div class="field"><label>Tür</label>
          <select id="kindInput">
            ${Object.entries(DIAPER_META).map(([k,m])=>`<option value="${k}" ${k===kind?'selected':''}>${m.label}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>Saat</label><input type="datetime-local" id="timeInput" value="${timeVal}" /></div>
      </div>
      <div class="pactions">
        <button class="cancel-btn" data-act="closePanel">Vazgeç</button>
        ${editing?`<button class="delete-btn" data-act="delDiaper" data-id="${editing.id}">Sil</button>`:''}
        <button class="save-btn" data-act="saveDiaper">Kaydet</button>
      </div>
    </div>`;
  }

  // ================= CARE TAB =================
  function todayCareCount(kind){ return careLogs.filter(c=>c.kind===kind && isToday(c.time)).length; }
  function lastCareToday(kind){ return careLogs.filter(c=>c.kind===kind && isToday(c.time)).sort((a,b)=>new Date(b.time)-new Date(a.time))[0]; }
  function tplCare(){
    const rows = Object.entries(CARE_META).map(([kind, m])=>{
      const count = todayCareCount(kind);
      const last = lastCareToday(kind);
      const targetTime = m.settingKey ? settings[m.settingKey] : null;
      let overdueNote = '';
      if(targetTime && count===0){
        const [hh,mm] = targetTime.split(':').map(Number);
        const target = new Date(); target.setHours(hh,mm,0,0);
        if(Date.now() > target.getTime()) overdueNote = `<span style="color:#e3a876;">saatini geçti (${targetTime})</span>`;
        else overdueNote = `bugün henüz yapılmadı · ${targetTime}'de hatırlatılacak`;
      } else if(targetTime){
        overdueNote = `bugün ${count} kez · hedef saat ${targetTime}`;
      } else {
        overdueNote = count>0 ? `bugün ${count} kez` : 'bugün henüz yapılmadı';
      }
      return `<div class="careRow">
        <div class="left">
          <div class="ic">${m.ic}</div>
          <div>
            <div class="ctitle">${m.label}</div>
            <div class="cmeta">${last?`son: ${timeStr(last.time)} · `:''}${overdueNote}</div>
          </div>
        </div>
        <button class="logbtn" data-act="logCare" data-kind="${kind}">+ Kaydet</button>
      </div>`;
    }).join('');

    const todayLogs = careLogs.filter(c=>isToday(c.time)).sort((a,b)=>new Date(b.time)-new Date(a.time));
    return `
      <div class="chartbox"><div class="chartTitle">Bugünkü bakım</div>${rows}</div>
      <div class="timeline">${todayLogs.length===0? `<div class="empty">Bugün için bakım kaydı yok.</div>` :
        `<div class="tlabel">Bugünkü kayıtlar</div>` + todayLogs.map(c=>{
          const m = CARE_META[c.kind];
          return `<div class="entry">
            <div class="dot care"></div>
            <div class="einfo"><div class="etype">${m.label}</div><div class="etime">${timeStr(c.time)} · ${agoStr(c.time)}</div></div>
            <div class="erow-actions"><button class="edel" data-act="delCare" data-id="${c.id}">✕</button></div>
          </div>`;
        }).join('')}
      </div>
      <div class="note">Hatırlatma saatlerini değiştirmek isterseniz haber verin.</div>`;
  }

  // ================= GROWTH TAB =================
  function tplGrowth(){
    const sorted = [...growth].sort((a,b)=> new Date(a.measured_on)-new Date(b.measured_on));
    const chart = sorted.length>=2 ? buildGrowthChart(sorted) : `<div class="empty">Eğri için en az 2 ölçüm gerekiyor.</div>`;
    const listSorted = [...growth].sort((a,b)=> new Date(b.measured_on)-new Date(a.measured_on));
    return `
      <div class="actions cols4" style="grid-template-columns:1fr;">
        <button class="abtn care" data-act="openGrowth"><span class="ic">📏</span>Ölçüm Ekle</button>
      </div>
      <div id="panelHost">${openPanel && openPanel.section==='growth' ? panelGrowth() : ''}</div>
      <div class="chartbox">
        <div class="chartTitle">Kilo (kg) — zaman içinde</div>
        ${chart}
      </div>
      <div class="growthList">${listSorted.length===0? `<div class="empty">Henüz ölçüm yok.</div>` :
        listSorted.map(g=>`<div class="entry">
          <div class="dot care"></div>
          <div class="einfo"><div class="etype">${new Date(g.measured_on+'T00:00:00').toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'})}</div>
          <div class="etime">${g.weight_kg?g.weight_kg+' kg':''}${g.weight_kg&&g.height_cm?' · ':''}${g.height_cm?g.height_cm+' cm':''}</div></div>
          <div class="erow-actions">
            <button class="eedit" data-act="editGrowth" data-id="${g.id}">✎</button>
            <button class="edel" data-act="delGrowth" data-id="${g.id}">✕</button>
          </div>
        </div>`).join('')}
      </div>`;
  }
  function panelGrowth(){
    const editing = openPanel.editingId ? growth.find(g=>g.id===openPanel.editingId) : null;
    return `<div class="panel">
      <div class="ptitle">Ölçüm ${editing?'düzenle':'ekle'}</div>
      <div class="prow">
        <div class="field"><label>Kilo (kg)</label><input type="number" step="0.01" id="weightInput" value="${editing&&editing.weight_kg!=null?editing.weight_kg:''}" placeholder="ör. 4.2" /></div>
        <div class="field"><label>Boy (cm)</label><input type="number" step="0.1" id="heightInput" value="${editing&&editing.height_cm!=null?editing.height_cm:''}" placeholder="ör. 55" /></div>
      </div>
      <div class="field"><label>Tarih</label><input type="date" id="dateInput" value="${editing?editing.measured_on:todayStr()}" /></div>
      <div class="pactions">
        <button class="cancel-btn" data-act="closePanel">Vazgeç</button>
        ${editing?`<button class="delete-btn" data-act="delGrowth" data-id="${editing.id}">Sil</button>`:''}
        <button class="save-btn" data-act="saveGrowth">Kaydet</button>
      </div>
    </div>`;
  }
  function buildGrowthChart(sorted){
    const withWeight = sorted.filter(g=>g.weight_kg!=null);
    if(withWeight.length<2) return `<div class="empty">Eğri için en az 2 kilo ölçümü gerekiyor.</div>`;
    const w = 320, h = 120, padL=30, padR=10, padT=10, padB=20;
    const xs = withWeight.map(g=>new Date(g.measured_on).getTime());
    const ys = withWeight.map(g=>g.weight_kg);
    const minX=Math.min(...xs), maxX=Math.max(...xs), minY=Math.min(...ys)-0.2, maxY=Math.max(...ys)+0.2;
    const px = x => padL + (maxX===minX?0:(x-minX)/(maxX-minX))*(w-padL-padR);
    const py = y => (h-padB) - ((y-minY)/(maxY-minY))*(h-padT-padB);
    const points = withWeight.map(g=>`${px(new Date(g.measured_on).getTime())},${py(g.weight_kg)}`).join(' ');
    const dots = withWeight.map(g=>`<circle cx="${px(new Date(g.measured_on).getTime())}" cy="${py(g.weight_kg)}" r="3" fill="#f6c453"/>`).join('');
    return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;">
      <polyline points="${points}" fill="none" stroke="#f6c453" stroke-width="2" />
      ${dots}
      <text x="${padL}" y="${h-4}" fill="#8b93ac" font-size="9">${new Date(minX).toLocaleDateString('tr-TR',{day:'numeric',month:'short'})}</text>
      <text x="${w-padR}" y="${h-4}" fill="#8b93ac" font-size="9" text-anchor="end">${new Date(maxX).toLocaleDateString('tr-TR',{day:'numeric',month:'short'})}</text>
    </svg>`;
  }

  // ================= REMINDERS =================
  function renderReminders(){
    const items = [];
    const feedHours = parseFloat(settings.reminder_feed_hours || '2');
    const lastFeed = [...entries].sort((a,b)=> new Date(b.time)-new Date(a.time)).find(e=>e.type==='milk'||e.type==='formula');
    if(lastFeed && hoursAgo(lastFeed.time) >= feedHours){
      items.push({key:'feed', text:`Son beslenmeden ${Math.floor(hoursAgo(lastFeed.time))} saatten fazla geçti`});
    } else if(!lastFeed){
      items.push({key:'feed-none', text:`Henüz beslenme kaydı yok`});
    }
    Object.entries(CARE_META).forEach(([kind,m])=>{
      if(!m.settingKey) return;
      const target = settings[m.settingKey];
      if(!target) return;
      const count = todayCareCount(kind);
      if(count===0){
        const [hh,mm] = target.split(':').map(Number);
        const t = new Date(); t.setHours(hh,mm,0,0);
        if(Date.now() > t.getTime()) items.push({key:kind, text:`${m.label} bugün henüz yapılmadı (hedef saat ${target})`});
      }
    });
    el('reminders').innerHTML = items.map(i=>`<div class="reminder">⏰ ${i.text}</div>`).join('');
    // browser notifications (only while tab open/foreground-ish)
    items.forEach(i=>{
      if(!notified[i.key] && window.Notification && Notification.permission==='granted'){
        try{ new Notification('Bebek Takip', { body: i.text }); }catch(e){}
        notified[i.key] = true;
      }
    });
  }

  // ================= EVENTS =================
  function wireTabEvents(){
    document.getElementById('tabContent').onclick = async (ev)=>{
      const b = ev.target.closest('[data-act]');
      if(!b) return;
      const act = b.dataset.act;

      if(act==='prevDate' || act==='nextDate'){
        const section = b.dataset.section;
        const d = new Date(selectedDate[section]+'T00:00:00');
        d.setDate(d.getDate() + (act==='nextDate'?1:-1));
        selectedDate[section] = fmtDate(d);
        render();
      } else if(act==='today'){
        selectedDate[b.dataset.section] = todayStr(); render();
      } else if(act==='openFeed'){
        openPanel = {section:'feed', type:b.dataset.type, editingId:null}; render();
      } else if(act==='editFeed'){
        const e = entries.find(x=>x.id===b.dataset.id);
        openPanel = {section:'feed', type:e.type, editingId:e.id}; render();
      } else if(act==='delFeed'){
        await supabase.from('entries').delete().eq('id', b.dataset.id);
        openPanel=null;
      } else if(act==='saveFeed'){
        const amt = parseFloat(el('amtInput').value);
        const timeVal = el('timeInput').value;
        if(!amt || amt<=0){ el('amtInput').style.outline='2px solid var(--danger)'; return; }
        const iso = new Date(timeVal).toISOString();
        if(openPanel.editingId){
          await supabase.from('entries').update({ type:openPanel.type, amount:amt, time:iso }).eq('id', openPanel.editingId);
        } else {
          await supabase.from('entries').insert({ type:openPanel.type, amount:amt, time:iso });
        }
        selectedDate.feed = iso.slice(0,10);
        openPanel = null;

      } else if(act==='quickDiaper'){
        await supabase.from('diapers').insert({ kind:b.dataset.kind, time:new Date().toISOString() });
      } else if(act==='editDiaper'){
        const d = diapers.find(x=>x.id===b.dataset.id);
        openPanel = {section:'diaper', kind:d.kind, editingId:d.id}; render();
      } else if(act==='delDiaper'){
        await supabase.from('diapers').delete().eq('id', b.dataset.id);
        openPanel=null;
      } else if(act==='saveDiaper'){
        const kind = el('kindInput').value;
        const timeVal = el('timeInput').value;
        const iso = new Date(timeVal).toISOString();
        if(openPanel.editingId){
          await supabase.from('diapers').update({ kind, time:iso }).eq('id', openPanel.editingId);
        } else {
          await supabase.from('diapers').insert({ kind, time: iso });
        }
        selectedDate.diaper = iso.slice(0,10);
        openPanel = null;

      } else if(act==='logCare'){
        await supabase.from('care_logs').insert({ kind:b.dataset.kind, time:new Date().toISOString() });
      } else if(act==='delCare'){
        await supabase.from('care_logs').delete().eq('id', b.dataset.id);

      } else if(act==='openGrowth'){
        openPanel = {section:'growth', editingId:null}; render();
      } else if(act==='editGrowth'){
        openPanel = {section:'growth', editingId:b.dataset.id}; render();
      } else if(act==='delGrowth'){
        await supabase.from('growth').delete().eq('id', b.dataset.id);
        openPanel=null;
      } else if(act==='saveGrowth'){
        const weight = el('weightInput').value ? parseFloat(el('weightInput').value) : null;
        const height = el('heightInput').value ? parseFloat(el('heightInput').value) : null;
        const date = el('dateInput').value;
        if(!weight && !height){ return; }
        if(openPanel.editingId){
          await supabase.from('growth').update({ weight_kg:weight, height_cm:height, measured_on:date }).eq('id', openPanel.editingId);
        } else {
          await supabase.from('growth').insert({ weight_kg:weight, height_cm:height, measured_on:date });
        }
        openPanel = null;

      } else if(act==='closePanel'){
        openPanel = null;
      }
      render();
    };
  }

  document.querySelectorAll('.tabbtn').forEach(b=>{
    b.addEventListener('click', ()=>{ activeTab = b.dataset.tab; openPanel=null; render(); });
  });

  document.getElementById('exportBtn').addEventListener('click', ()=>{
    const backup = { exported_at: new Date().toISOString(), entries, diapers, careLogs, growth };
    const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `bebek-takip-yedek-${todayStr()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  });

  if(window.Notification && Notification.permission==='default'){
    // ask politely the first time the app is used, after login
  }

  // ================= SUPABASE WIRING =================
  let supabase;
  function showLogin(){ el('loginScreen').style.display='block'; el('appScreen').style.display='none'; el('tabbar').style.display='none'; }
  function showApp(){ el('loginScreen').style.display='none'; el('appScreen').style.display='block'; el('tabbar').style.display='flex'; }

  async function refetchAll(){
    const [e1,e2,e3,e4,e5] = await Promise.all([
      supabase.from('entries').select('*').order('time',{ascending:false}),
      supabase.from('diapers').select('*').order('time',{ascending:false}),
      supabase.from('care_logs').select('*').order('time',{ascending:false}),
      supabase.from('growth').select('*').order('measured_on',{ascending:false}),
      supabase.from('settings').select('*'),
    ]);
    if(!e1.error) entries = e1.data.map(x=>({...x, amount:Number(x.amount)}));
    if(!e2.error) diapers = e2.data;
    if(!e3.error) careLogs = e3.data;
    if(!e4.error) growth = e4.data;
    if(!e5.error){ settings = {}; e5.data.forEach(r=> settings[r.key]=r.value); }
    render();
  }

  async function startApp(){
    refetchAll().then(()=>{
      el('connBadge').classList.remove('offline');
      el('connText').textContent = 'Bağlı';
      el('loadingNote').textContent = 'Beslenme, bez, bakım ve büyüme takibi';
      if(window.Notification && Notification.permission==='default'){
        Notification.requestPermission();
      }
      setupPushNotifications();
    });
    ['entries','diapers','care_logs','growth','settings'].forEach(table=>{
      supabase.channel(table+'-changes').on('postgres_changes', {event:'*',schema:'public',table}, refetchAll).subscribe();
    });
    setInterval(render, 30000);
  }

  async function tryLogin(pin){
    const { error } = await supabase.auth.signInWithPassword({ email: SHARED_LOGIN_EMAIL, password: pin });
    if(error){ el('loginError').style.display='block'; return; }
    el('loginError').style.display='none';
    showApp(); startApp();
  }

  if(isConfigured){
    supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth:{ persistSession:true, autoRefreshToken:true } });
    supabase.auth.getSession().then(({data})=>{
      if(data.session){ showApp(); startApp(); } else { showLogin(); }
    });
    el('loginBtn').addEventListener('click', ()=> tryLogin(el('pinInput').value));
    el('pinInput').addEventListener('keydown', e=>{ if(e.key==='Enter') el('loginBtn').click(); });
  } else {
    showApp();
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Bebek Takip</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="theme-color" content="#17141c" id="themeColor" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Bebek Takip" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html[data-theme="dark"]{
    --ink:#17141c; --surface:#211c29; --surface-2:#2b2435; --line:#372e43;
    --text:#f3eee9; --muted:#9a8fa6;
    --milk:#f2c98a; --formula:#8fb8d9; --pump:#c9a0dc; --pee:#e0d089;
    --poop:#c08457; --care:#8fd0a8; --alert:#e8a06a; --danger:#e08585;
    --alertBg:rgba(232,160,106,.13); --alertTx:#f0c39a;
    --tabBg:rgba(23,20,28,.93); --shadow:none;
  }
  html[data-theme="light"]{
    --ink:#f8f4ed; --surface:#ffffff; --surface-2:#f2ece2; --line:#e6ddd1;
    --text:#2b2430; --muted:#7a6f86;
    --milk:#c08a2c; --formula:#3f7ba6; --pump:#8557ad; --pee:#a8901f;
    --poop:#8e5a2b; --care:#357f56; --alert:#b96b25; --danger:#c05252;
    --alertBg:rgba(185,107,37,.10); --alertTx:#8a4f18;
    --tabBg:rgba(248,244,237,.94); --shadow:0 1px 2px rgba(43,36,48,.05);
  }
  :root{ --r:16px; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;background:var(--ink);}
  body{font-family:'Inter',system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;
    transition:background .25s ease,color .25s ease;}

  .shell{max-width:460px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 14px 96px;}

  /* login */
  .loginWrap{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .loginCard{width:100%;max-width:340px;text-align:center;}
  .loginMoon{font-size:40px;line-height:1;margin-bottom:14px;}
  .loginTitle{font-family:'Fraunces',serif;font-weight:600;font-size:27px;margin:0 0 6px;letter-spacing:-0.3px;}
  .loginSub{color:var(--muted);font-size:13px;margin-bottom:22px;}
  .loginCard input{width:100%;background:var(--surface);border:1px solid var(--line);color:var(--text);
    border-radius:14px;padding:14px 16px;font-size:16px;text-align:center;letter-spacing:2px;font-family:'Inter',sans-serif;}
  .loginCard input:focus{outline:none;border-color:var(--milk);}
  .loginCard button{width:100%;margin-top:10px;background:var(--text);color:var(--ink);border:none;border-radius:14px;
    padding:14px;font-family:'Fraunces',serif;font-weight:600;font-size:15px;cursor:pointer;}
  .loginErr{color:var(--danger);font-size:12.5px;margin-top:12px;min-height:16px;}

  /* header */
  .hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;}
  .hdrL{display:flex;align-items:center;gap:11px;}
  .hdrMoon{font-size:25px;line-height:1;position:relative;}
  .hdrMoon .star{position:absolute;top:-1px;left:-4px;font-size:9px;opacity:.75;}
  .hdrName{font-family:'Fraunces',serif;font-weight:600;font-size:21px;margin:0;letter-spacing:-0.3px;line-height:1.1;}
  .hdrSub{color:var(--muted);font-size:11.5px;margin-top:3px;}
  .hdrR{display:flex;align-items:center;gap:7px;padding-top:4px;}
  .ghost{background:var(--surface);border:1px solid var(--line);color:var(--muted);width:31px;height:31px;
    border-radius:9px;font-size:13px;cursor:pointer;display:grid;place-items:center;box-shadow:var(--shadow);}
  .conn{width:7px;height:7px;border-radius:50%;background:var(--care);}
  .conn.off{background:var(--danger);}

  /* rhythm */
  .rhythm{background:var(--surface);border-radius:var(--r);padding:13px 14px 9px;margin-bottom:12px;box-shadow:var(--shadow);}
  .rhythmTop{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px;}
  .rhythmLabel{font-size:10.5px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;}
  .rhythmCount{font-family:'Fraunces',serif;font-size:12px;color:var(--muted);}
  .rhythmTicks{display:flex;justify-content:space-between;margin-top:5px;}
  .rhythmTicks span{font-size:9px;color:var(--muted);opacity:.65;}

  .alert{background:var(--alertBg);border-left:2px solid var(--alert);color:var(--alertTx);
    border-radius:10px;padding:10px 12px;font-size:12.5px;margin-bottom:7px;line-height:1.4;}

  .dbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .dbar button{background:none;border:none;color:var(--muted);font-size:19px;padding:6px 12px;cursor:pointer;}
  .dbarMid{text-align:center;}
  .dbarDate{font-family:'Fraunces',serif;font-weight:600;font-size:14.5px;}
  .dbarToday{font-size:10.5px;color:var(--milk);cursor:pointer;margin-top:2px;}

  .stats{display:flex;gap:9px;margin-bottom:14px;}
  .stat{flex:1;background:var(--surface);border-radius:var(--r);padding:12px 13px;box-shadow:var(--shadow);}
  .statLabel{font-size:10.5px;color:var(--muted);margin-bottom:5px;}
  .statVal{font-family:'Fraunces',serif;font-weight:600;font-size:21px;line-height:1;letter-spacing:-0.5px;}
  .statUnit{font-family:'Inter',sans-serif;font-size:11px;color:var(--muted);font-weight:400;margin-left:2px;}
  .statSince{background:var(--surface);border-radius:var(--r);padding:13px 14px;margin-bottom:14px;
    display:flex;justify-content:space-between;align-items:center;box-shadow:var(--shadow);}

  .acts{display:grid;gap:9px;margin-bottom:14px;}
  .acts.c3{grid-template-columns:repeat(3,1fr);}
  .act{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 6px;
    display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;color:var(--text);
    font-family:'Fraunces',serif;font-weight:600;font-size:12.5px;transition:transform .08s;box-shadow:var(--shadow);}
  .act:active{transform:scale(.96);}
  .act .swatch{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:14px;box-shadow:var(--shadow);}
  .panelTitle{font-family:'Fraunces',serif;font-weight:600;font-size:14.5px;margin-bottom:12px;}
  .fld{margin-bottom:11px;}
  .fld label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;}
  .fld input,.fld select{width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    border-radius:11px;padding:11px 12px;font-size:15px;font-family:'Inter',sans-serif;}
  .fld input:focus,.fld select:focus{outline:none;border-color:var(--milk);}
  .row2{display:flex;gap:9px;}
  .row2 .fld{flex:1 1 0;min-width:0;}
  .row2 .fld input{width:100%;min-width:0;}
  input[type="time"],input[type="date"]{-webkit-appearance:none;appearance:none;text-align:left;}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:11px;}
  .chip{background:var(--surface-2);border:1px solid var(--line);color:var(--muted);border-radius:20px;
    padding:7px 13px;font-size:12.5px;cursor:pointer;font-family:'Inter',sans-serif;}
  .chip.on{background:var(--text);color:var(--ink);border-color:var(--text);font-weight:600;}
  .pacts{display:flex;gap:8px;margin-top:3px;}
  .pacts button{flex:1;border:none;border-radius:11px;padding:12px;font-family:'Fraunces',serif;
    font-weight:600;font-size:13.5px;cursor:pointer;}
  .bSave{background:var(--text);color:var(--ink);}
  .bCancel{background:var(--surface-2);color:var(--muted);}
  .bDel{background:var(--alertBg);color:var(--danger);}
  .toggleRow{display:flex;align-items:center;gap:9px;margin-bottom:11px;cursor:pointer;}
  .toggleBox{width:19px;height:19px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);
    display:grid;place-items:center;font-size:12px;color:var(--ink);flex-shrink:0;}
  .toggleBox.on{background:var(--milk);border-color:var(--milk);}
  .toggleLabel{font-size:13px;}
  .setGroup{margin-bottom:15px;}
  .setGroup:last-of-type{margin-bottom:8px;}
  .setLabel{font-size:11px;color:var(--muted);margin-bottom:7px;}

  .listLabel{font-size:10.5px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;margin:16px 2px 9px;}
  .item{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);}
  .item:last-child{border-bottom:none;}
  .bar{width:3px;height:30px;border-radius:2px;flex-shrink:0;}
  .itemMid{flex:1;min-width:0;}
  .itemName{font-family:'Fraunces',serif;font-weight:600;font-size:13.5px;}
  .itemMeta{font-size:11px;color:var(--muted);margin-top:2px;}
  .itemVal{font-family:'Fraunces',serif;font-weight:600;font-size:14.5px;white-space:nowrap;}
  .itemBtns{display:flex;}
  .itemBtns button{background:none;border:none;color:var(--muted);font-size:14px;padding:6px 5px;cursor:pointer;}
  .blank{text-align:center;color:var(--muted);font-size:12.5px;padding:30px 12px;line-height:1.6;}

  .care{background:var(--surface);border-radius:var(--r);padding:14px;margin-bottom:9px;box-shadow:var(--shadow);}
  .careTop{display:flex;align-items:center;justify-content:space-between;gap:11px;}
  .careL{display:flex;align-items:center;gap:11px;min-width:0;}
  .careIc{width:34px;height:34px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;font-size:16px;flex-shrink:0;}
  .careIc.done{background:var(--alertBg);}
  .careName{font-family:'Fraunces',serif;font-weight:600;font-size:14px;}
  .careMeta{font-size:11px;color:var(--muted);margin-top:2px;}
  .careMeta .late{color:var(--alert);}
  .careAdd{background:var(--surface-2);border:1px solid var(--line);color:var(--text);border-radius:11px;
    padding:9px 14px;font-family:'Fraunces',serif;font-weight:600;font-size:13px;cursor:pointer;flex-shrink:0;}
  .careAdd.done{color:var(--care);border-color:var(--care);}
  .careBottom{display:flex;align-items:center;justify-content:space-between;margin-top:11px;
    padding-top:11px;border-top:1px solid var(--line);}
  .careTimes{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted);}
  .careTimes input{background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    border-radius:8px;padding:5px 8px;font-size:12px;font-family:'Inter',sans-serif;}
  .careDots{display:flex;gap:4px;align-items:center;}
  .careDot{width:7px;height:7px;border-radius:50%;background:var(--care);}
  .careUndo{background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer;text-decoration:underline;padding:0;}

  .chart{background:var(--surface);border-radius:var(--r);padding:15px 12px 12px;margin-bottom:14px;box-shadow:var(--shadow);}
  .chartHdr{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;padding:0 3px;}
  .chartTitle{font-size:10.5px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;}
  .chartDelta{font-family:'Fraunces',serif;font-size:12.5px;color:var(--care);}
  .birthTag{display:inline-block;background:var(--alertBg);color:var(--milk);border-radius:5px;
    padding:1px 6px;font-size:9.5px;margin-left:6px;font-family:'Inter',sans-serif;vertical-align:middle;}

  .sideCard{background:var(--surface);border-radius:var(--r);padding:11px 14px;margin-bottom:14px;box-shadow:var(--shadow);}
  .sideRow{display:flex;justify-content:space-between;align-items:center;padding:3px 0;}
  .sideK{font-size:11.5px;color:var(--muted);}
  .sideV{font-family:'Fraunces',serif;font-weight:600;font-size:13px;}
  .sideNext{font-family:'Inter',sans-serif;font-weight:400;font-size:11px;color:var(--milk);}
  .sideTag{display:inline-block;background:var(--surface-2);color:var(--muted);border-radius:5px;
    padding:1px 6px;font-size:9.5px;margin-left:6px;font-family:'Inter',sans-serif;vertical-align:middle;}

  .vgroup{margin-bottom:16px;}
  .vgHdr{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;padding:0 2px;}
  .vgMonth{font-family:'Fraunces',serif;font-weight:600;font-size:13.5px;}
  .vgDate{font-size:10.5px;color:var(--muted);flex:1;}
  .vgDone{color:var(--care);font-size:12px;}
  .vrow{display:flex;align-items:center;gap:11px;background:var(--surface);border-radius:12px;
    padding:11px 12px;margin-bottom:6px;box-shadow:var(--shadow);}
  .vrow.done{opacity:.62;}
  .vdot{width:19px;height:19px;border-radius:50%;border:1.5px solid var(--line);flex-shrink:0;
    display:grid;place-items:center;font-size:11px;color:var(--ink);}
  .vdot.done{background:var(--care);border-color:var(--care);}
  .vdot.late{border-color:var(--alert);}
  .vmid{flex:1;min-width:0;}
  .vname{font-size:13px;font-weight:500;line-height:1.3;}
  .vdose{color:var(--muted);font-size:10.5px;}
  .vmeta{font-size:10.5px;color:var(--muted);margin-top:2px;}
  .vbtn{background:none;border:1px solid var(--line);color:var(--muted);border-radius:9px;
    padding:6px 11px;font-size:11.5px;cursor:pointer;flex-shrink:0;font-family:'Inter',sans-serif;}
  .vbtn.on{border-color:var(--care);color:var(--care);}
  .vnote{font-size:10.5px;color:var(--muted);line-height:1.6;margin-top:18px;padding:0 2px;}

  .careIc.due{box-shadow:0 0 0 2px var(--alert);}
  .rx{display:inline-block;background:var(--alertBg);color:var(--alert);border-radius:5px;
    padding:1px 6px;font-size:9.5px;font-family:'Inter',sans-serif;vertical-align:middle;margin-left:4px;}
  .pips{display:flex;align-items:center;gap:5px;}
  .pip{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line);}
  .pip.on{background:var(--care);border-color:var(--care);}
  .pipTxt{font-size:11px;color:var(--muted);margin-left:4px;}
  .careCog{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;padding:2px 4px;}
  .careSet{margin-top:11px;padding-top:11px;border-top:1px solid var(--line);}
  .careSet .setLabel{margin-top:8px;}
  .careSet .chips{margin-bottom:4px;}
  .tin{background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    border-radius:9px;padding:7px 10px;font-size:13px;font-family:'Inter',sans-serif;}
  .cbx{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text);
    background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:7px 13px;cursor:pointer;}
  .cbx input{accent-color:var(--milk);}
  .setHint{font-size:10.5px;color:var(--muted);line-height:1.5;margin-top:8px;}

  /* ---------- print report ---------- */
  .printArea{display:none;}
  @media print{
    body{background:#fff !important;color:#000 !important;}
    .shell,.tabs,.loginWrap{display:none !important;}
    .printArea{display:block !important;font-family:'Inter',sans-serif;color:#000;padding:0;}
    .rhead{border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:14px;}
    .rhead h1{font-family:'Fraunces',serif;font-size:19px;margin:0 0 4px;}
    .rmeta{font-size:11px;color:#444;}
    .rtot{margin-bottom:18px;}
    .rtot h2{font-size:13px;margin:0 0 6px;font-family:'Fraunces',serif;}
    .printArea table{width:100%;border-collapse:collapse;font-size:11px;}
    .printArea th,.printArea td{text-align:left;padding:3px 6px;border-bottom:1px solid #ddd;}
    .printArea th{background:#f0f0f0;font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.4px;}
    .rday{margin-bottom:14px;page-break-inside:avoid;}
    .rday h3{font-family:'Fraunces',serif;font-size:12.5px;margin:0 0 3px;}
    .rsum{font-size:10.5px;color:#444;margin-bottom:5px;}
    .rfoot{margin-top:18px;padding-top:6px;border-top:1px solid #ccc;font-size:9.5px;color:#666;}
    @page{margin:14mm;}
  }

  .tabs{position:fixed;left:0;right:0;bottom:0;background:var(--tabBg);backdrop-filter:blur(14px);
    border-top:1px solid var(--line);display:flex;padding:7px 8px calc(7px + env(safe-area-inset-bottom));
    max-width:460px;margin:0 auto;}
  .tab{flex:1;background:none;border:none;color:var(--muted);padding:7px 2px;display:flex;flex-direction:column;
    align-items:center;gap:4px;cursor:pointer;font-size:10px;font-family:'Inter',sans-serif;font-weight:500;position:relative;}
  .tab .ti{font-size:17px;opacity:.5;transition:opacity .15s;}
  .tab.on{color:var(--text);}
  .tab.on .ti{opacity:1;}
  .tab.on::before{content:'';position:absolute;top:-1px;width:16px;height:2px;border-radius:2px;background:var(--milk);}
</style>
</head>
<body>

<div class="loginWrap" id="loginScreen" style="display:none;">
  <div class="loginCard">
    <div class="loginMoon">🌙</div>
    <h1 class="loginTitle">Bebek Takip</h1>
    <div class="loginSub">Devam etmek için şifre girin</div>
    <input type="password" id="pinInput" placeholder="••••••••" autocomplete="current-password" />
    <button id="loginBtn">Giriş yap</button>
    <div class="loginErr" id="loginErr"></div>
  </div>
</div>

<div class="shell" id="appScreen" style="display:none;">
  <div class="hdr">
    <div class="hdrL">
      <div class="hdrMoon">🌙<span class="star">✦</span></div>
      <div>
        <h1 class="hdrName" id="hdrName"></h1>
        <div class="hdrSub" id="hdrSub">Bağlanılıyor…</div>
      </div>
    </div>
    <div class="hdrR">
      <button class="ghost" id="themeBtn" title="Tema">☾</button>
      <button class="ghost" id="setBtn" title="Ayarlar">⚙</button>
      <button class="ghost" id="exportBtn" title="Yedek indir">↓</button>
      <div class="conn off" id="conn"></div>
    </div>
  </div>
  <div id="alerts"></div>
  <div id="settingsSlot"></div>
  <div id="content"></div>
</div>

<div class="tabs" id="tabs" style="display:none;">
  <button class="tab" data-tab="feed"><span class="ti">🍼</span>Beslenme</button>
  <button class="tab" data-tab="diaper"><span class="ti">💧</span>Bez</button>
  <button class="tab" data-tab="care"><span class="ti">🧴</span>Bakım</button>
  <button class="tab" data-tab="growth"><span class="ti">📐</span>Büyüme</button>
  <button class="tab" data-tab="vaccine"><span class="ti">💉</span>Aşı</button>
</div>

<div id="printArea" class="printArea"></div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL="https://mqsrnkzdfzstznfqflso.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_2yIWU2OZOqhKoXORpO5_9g_rzey2_9z";
const LOGIN_EMAIL="aile@bebektakip.app";
const VAPID_PUBLIC_KEY="BJZkyQ1h6ATndhytyv-MwjU4YSiWxF3wyiROm6IwREzDEguikK1MAwx1poklTCARspIURcBb4urk_y88BrBPJbA";
const BABY="Alp";

/* ---- theme ---- */
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  const c=document.getElementById('themeColor');
  if(c) c.setAttribute('content', t==='dark' ? '#17141c' : '#f8f4ed');
  const b=document.getElementById('themeBtn');
  if(b) b.textContent = t==='dark' ? '☾' : '☀';
  try{ localStorage.setItem('theme',t); }catch(e){}
}
(function(){ let t='dark'; try{ t=localStorage.getItem('theme')||'dark'; }catch(e){} applyTheme(t); })();

/* ---- date helpers (local time) ---- */
function fmtDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function localDay(iso){ return fmtDate(new Date(iso)); }
function today(){ return fmtDate(new Date()); }
function addDays(ds,n){ const d=new Date(ds+'T00:00:00'); d.setDate(d.getDate()+n); return fmtDate(d); }
function isToday(iso){ return localDay(iso)===today(); }
function dayLabel(ds){
  const y=new Date(); y.setDate(y.getDate()-1);
  const d=new Date(ds+'T00:00:00');
  const base=d.toLocaleDateString('tr-TR',{day:'numeric',month:'long',weekday:'long'});
  if(ds===today()) return 'Bugün · '+base;
  if(ds===fmtDate(y)) return 'Dün · '+base;
  return base;
}
function hhmm(iso){ return new Date(iso).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}); }
function ago(iso){
  const m=Math.floor((Date.now()-new Date(iso).getTime())/60000);
  if(m<1) return 'az önce';
  if(m<60) return m+' dk önce';
  const h=Math.floor(m/60), r=m%60;
  return h+' sa'+(r?' '+r+' dk':'')+' önce';
}
function hoursSince(iso){ return (Date.now()-new Date(iso).getTime())/3600000; }
function localInput(iso){
  const d=iso?new Date(iso):new Date();
  return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);
}
/* time-only (HH:MM) — the date comes from the date bar above */
function timeOnly(iso){
  const d=iso?new Date(iso):new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function combineDT(dateStr,hm){
  if(!hm) hm=timeOnly(null);
  return new Date(dateStr+'T'+hm+':00').toISOString();
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

const g = kg => kg==null?null:Math.round(kg*1000);
const fmtG = grams => grams==null?'':grams.toLocaleString('tr-TR')+' g';
function fmtDelta(grams){
  const s=grams>0?'+':grams<0?'−':'';
  return s+Math.abs(grams).toLocaleString('tr-TR')+' g';
}
function babyAge(birthDate){
  const b=new Date(birthDate+'T00:00:00'), n=new Date();
  const days=Math.floor((n-b)/86400000);
  if(days<0) return null;
  if(days===0) return 'bugün doğdu';
  if(days<14) return days+' günlük';
  if(days<60) return Math.floor(days/7)+' haftalık';
  const months=Math.floor(days/30.44), rem=days-Math.floor(months*30.44);
  return months+' aylık'+(rem>=7?' '+Math.floor(rem/7)+' haftalık':'');
}

/* ---- rhythm strip ---- */
function rhythmStrip(dateStr, mode){
  const marks=[];
  if(mode==='feed')
    entries.filter(e=>localDay(e.time)===dateStr).forEach(e=>marks.push({t:e.time,c:FEED[e.type].color}));
  else
    diapers.filter(d=>localDay(d.time)===dateStr).forEach(d=>marks.push({t:d.time,c:DIAPER[d.kind].color}));
  const W=340,H=26;
  const pos=iso=>{const d=new Date(iso);return ((d.getHours()*60+d.getMinutes())/1440)*W;};
  const now=new Date();
  const nowX=dateStr===today()?((now.getHours()*60+now.getMinutes())/1440)*W:null;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block;" preserveAspectRatio="none">
    <rect x="0" y="${H/2-3}" width="${W}" height="6" rx="3" fill="var(--surface-2)"/>
    ${[6,12,18].map(h=>`<line x1="${(h/24)*W}" y1="${H/2-6}" x2="${(h/24)*W}" y2="${H/2+6}" stroke="var(--line)" stroke-width="1"/>`).join('')}
    ${nowX!==null?`<line x1="${nowX}" y1="2" x2="${nowX}" y2="${H-2}" stroke="var(--text)" stroke-width="1" opacity=".35"/>`:''}
    ${marks.map(m=>`<rect x="${pos(m.t)-1.5}" y="${H/2-9}" width="3" height="18" rx="1.5" fill="${m.c}"/>`).join('')}
  </svg><div class="rhythmTicks"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div>`;
}

}

    if(!fe.length&&!di.length) return '';

      ${opts.feed?`<tr><td>Toplam beslenme</td><td>${totFeeds} kez</td><td>günlük ort. ${(totFeeds/nd).toFixed(1)}</td></tr>
      <tr><td>Anne sütü</td><td>${totMilk} cc</td><td>günlük ort. ${Math.round(totMilk/nd)} cc</td></tr>
      <tr><td>Mama</td><td>${totFormula} cc</td><td>günlük ort. ${Math.round(totFormula/nd)} cc</td></tr>
      <tr><td>Toplam alım</td><td>${totMilk+totFormula} cc</td><td>günlük ort. ${Math.round((totMilk+totFormula)/nd)} cc</td></tr>
      <tr><td>Sağılan süt</td><td>${totPump} cc</td><td>günlük ort. ${Math.round(totPump/nd)} cc</td></tr>`:''}
      ${opts.diaper?`<tr><td>Çiş</td><td>${totPee}</td><td>günlük ort. ${(totPee/nd).toFixed(1)}</td></tr>
      <tr><td>Kaka</td><td>${totPoop}</td><td>günlük ort. ${(totPoop/nd).toFixed(1)}</td></tr>`:''}

function birthDate(){
  const b=growth.find(x=>x.is_birth);
  return b?b.measured_on:null;
}
function addMonths(dateStr,m){
  const d=new Date(dateStr+'T00:00:00');
  const day=d.getDate();
  d.setMonth(d.getMonth()+m);
  if(d.getDate()<day) d.setDate(0);
  return fmtDate(d);
}
function vaccineRows(){
  const bd=birthDate();
  return VACCINES.map(v=>{
    const done=vaccines.find(x=>x.code===v.code&&x.dose===v.dose);
    const due=bd?addMonths(bd,v.m):null;
    let status='unknown';
    if(done) status='done';
    else if(due){
      const days=Math.floor((new Date(due+'T00:00:00')-new Date(today()+'T00:00:00'))/86400000);
      status = days<-14?'late' : days<=30?'soon' : 'future';
    }
    return {...v,done,due,status};
  });
}
function monthLabel(m){
  if(m===0) return 'Doğumda';

  if(m%12===0) return (m/12)+' yaş';

}

/* ---- CARE ---- */
function careToday(k){ return careLogs.filter(c=>c.kind===k&&isToday(c.time)).sort((a,b)=>new Date(b.time)-new Date(a.time)); }
function carePerDay(k){ const v=parseInt(settings['care_'+k+'_perday']); return isNaN(v)?(CARE[k].daily||0):v; }
function careInterval(k){ const v=parseFloat(settings['care_'+k+'_interval']); return isNaN(v)?8:v; }
function careTime(k){ return settings['reminder_'+k+'_time']||'09:00'; }
/* bir sonraki dozun zamanı gelmiş mi? */
function careDue(k){
  const target=carePerDay(k);
  if(!target) return false;
  const list=careToday(k);
  if(list.length>=target) return false;
  if(list.length===0){
    const [h,mi]=careTime(k).split(':').map(Number);
    const t=new Date(); t.setHours(h,mi,0,0);
    return Date.now()>t.getTime();
  }
  return hoursSince(list[0].time) >= careInterval(k);
}
const DOSE_OPTS=[0,1,2,3,4,5,6];
const IV_OPTS=[3,4,6,8,12];

function viewCare(){
  const rows=Object.entries(CARE).map(([kind,m])=>{
    const list=careToday(kind), n=list.length;
    const target=carePerDay(kind);
    const done=target>0 && n>=target;
    const due=careDue(kind);
    const open=carePanel===kind;

    let meta;
    if(target>0){
      if(done) meta=`Bugün tamamlandı · son ${hhmm(list[0].time)}`;
      else if(n===0) meta = due?`<span class="late">İlk doz saati geçti</span>`:`Bugün ${target} doz planlandı`;
      else meta = due?`<span class="late">Sıradaki doz zamanı geldi</span>`:`son ${hhmm(list[0].time)} · sonraki ${careInterval(kind)} sa sonra`;
    } else {
      meta = n>0?`Bugün ${n} kez · son ${hhmm(list[0].time)}`:'Hatırlatma kapalı';
    }

    const pips = target>0
      ? `<div class="pips">${Array.from({length:target}).map((_,i)=>
          `<span class="pip ${i<n?'on':''}"></span>`).join('')}
         <span class="pipTxt">${n}/${target}</span></div>`
      : `<div class="pips">${n?Array.from({length:Math.min(n,8)}).map(()=>`<span class="pip on"></span>`).join(''):''}
         <span class="pipTxt">${n?n+' kez':'—'}</span></div>`;

    return `<div class="care"><div class="careTop">
      <div class="careL"><div class="careIc ${done?'done':''} ${due?'due':''}">${m.ic}</div>
        <div style="min-width:0;"><div class="careName">${m.name}${target>1?` <span class="rx">${target}x1</span>`:''}</div>
        <div class="careMeta">${meta}</div></div></div>
      <button class="careAdd ${done?'done':''}" data-a="logCare" data-k="${kind}">${done?'✓ Tamam':'+ Doz'}</button></div>
      <div class="careBottom">
        ${pips}
        <div style="display:flex;gap:10px;align-items:center;">
          ${n?`<button class="careUndo" data-a="undoCare" data-id="${list[0].id}">geri al</button>`:''}
          <button class="careCog" data-a="careCog" data-k="${kind}">${open?'▴':'⚙'}</button>
        </div>
      </div>
      ${open?`<div class="careSet">
        <div class="setLabel">Günde kaç doz?</div>
        <div class="chips">${DOSE_OPTS.map(v=>`<div class="chip ${v===target?'on':''}" data-a="setDose" data-k="${kind}" data-v="${v}">${v===0?'kapalı':v+'x1'}</div>`).join('')}</div>
        ${target>0?`
        <div class="setLabel">İlk doz saati</div>
        <div class="chips"><input type="time" class="tin" value="${careTime(kind)}" data-a="setTime" data-key="reminder_${kind}_time"/></div>
        ${target>1?`<div class="setLabel">Dozlar arası</div>
        <div class="chips">${IV_OPTS.map(v=>`<div class="chip ${v===careInterval(kind)?'on':''}" data-a="setCareIv" data-k="${kind}" data-v="${v}">${v} saat</div>`).join('')}</div>`:''}
        `:''}
      </div>`:''}
    </div>`;
  }).join('');

  const log=careLogs.filter(c=>isToday(c.time)).sort((a,b)=>new Date(b.time)-new Date(a.time));
  return rows+(log.length?`<div class="listLabel">Bugünün bakım kayıtları</div>`+log.map(c=>
    `<div class="item"><div class="bar" style="background:var(--care)"></div>
      <div class="itemMid"><div class="itemName">${CARE[c.kind].name}</div><div class="itemMeta">${hhmm(c.time)} · ${ago(c.time)}</div></div>
      <div class="itemBtns"><button data-a="delCare" data-id="${c.id}">✕</button></div></div>`).join('')
    :`<div class="blank">Bugün için bakım kaydı yok.</div>`);
}

function viewGrowth(){

  const latest=sorted[sorted.length-1];

  if(birth&&latest&&birth.id!==latest.id&&birth.weight_kg!=null&&latest.weight_kg!=null)
    delta=`Doğumdan beri ${fmtDelta(g(latest.weight_kg)-g(birth.weight_kg))}`;
  const desc=[...growth].sort((a,b)=>new Date(b.measured_on)-new Date(a.measured_on));
  return `<div class="acts" style="grid-template-columns:1fr;">
      <button class="act" data-a="newGrowth"><span class="swatch" style="background:var(--care)22;">📐</span>Ölçüm Ekle</button></div>
    <div id="panelSlot">${panel&&panel.s==='growth'?panelGrowth():''}</div>
    <div class="chart"><div class="chartHdr"><div class="chartTitle">Kilo eğrisi</div><div class="chartDelta">${delta}</div></div>${weightChart(sorted)}</div>
    ${!birth?`<div class="alert">Doğum kilosunu ekleyin — eğri oradan başlasın, ${BABY}'in büyümesi daha sağlıklı takip edilsin.</div>`:''}
    ${desc.length?`<div class="listLabel">Ölçümler</div>`+desc.map(x=>
      `<div class="item"><div class="bar" style="background:${x.is_birth?'var(--milk)':'var(--care)'}"></div>
        <div class="itemMid"><div class="itemName">${new Date(x.measured_on+'T00:00:00').toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'})}${x.is_birth?'<span class="birthTag">DOĞUM</span>':''}</div>
        <div class="itemMeta">${x.weight_kg!=null?fmtG(g(x.weight_kg)):''}${x.weight_kg!=null&&x.height_cm!=null?' · ':''}${x.height_cm!=null?x.height_cm+' cm':''}</div></div>
        <div class="itemBtns"><button data-a="editGrowth" data-id="${x.id}">✎</button><button data-a="delGrowth" data-id="${x.id}">✕</button></div></div>`).join('')
      :`<div class="blank">Henüz ölçüm yok.</div>`}`;
}
function weightChart(sorted){
  const pts=sorted.filter(x=>x.weight_kg!=null);
  if(pts.length<2) return `<div class="blank" style="padding:22px 10px;">Eğri için en az 2 kilo ölçümü gerekiyor.${pts.length===1?'<br>Bir ölçüm daha ekleyin.':''}</div>`;
  const W=320,H=130,L=42,R=8,T=12,B=22;
  const xs=pts.map(x=>new Date(x.measured_on).getTime()), ys=pts.map(x=>g(x.weight_kg));
  const x0=Math.min(...xs),x1=Math.max(...xs);
  const pad=(Math.max(...ys)-Math.min(...ys))*0.15||150;
  const y0=Math.min(...ys)-pad, y1=Math.max(...ys)+pad;
  const px=v=>L+(x1===x0?0:(v-x0)/(x1-x0))*(W-L-R);
  const py=v=>(H-B)-((v-y0)/(y1-y0))*(H-T-B);
  const line=pts.map(x=>`${px(new Date(x.measured_on).getTime())},${py(g(x.weight_kg))}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;">
    <defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--milk)" stop-opacity=".22"/><stop offset="100%" stop-color="var(--milk)" stop-opacity="0"/></linearGradient></defs>
    <polygon points="${L},${H-B} ${line} ${px(x1)},${H-B}" fill="url(#wg)"/>
    <polyline points="${line}" fill="none" stroke="var(--milk)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(x=>`<circle cx="${px(new Date(x.measured_on).getTime())}" cy="${py(g(x.weight_kg))}" r="${x.is_birth?4:3}" fill="${x.is_birth?'var(--surface)':'var(--milk)'}" stroke="var(--milk)" stroke-width="${x.is_birth?2:0}"/>`).join('')}
    <text x="2" y="${py(y1)+4}" fill="var(--muted)" font-size="8.5">${Math.round(y1).toLocaleString('tr-TR')}</text>
    <text x="2" y="${py(y0)+4}" fill="var(--muted)" font-size="8.5">${Math.round(y0).toLocaleString('tr-TR')}</text>
    <text x="${L}" y="${H-5}" fill="var(--muted)" font-size="9">${new Date(x0).toLocaleDateString('tr-TR',{day:'numeric',month:'short'})}</text>
    <text x="${W-R}" y="${H-5}" fill="var(--muted)" font-size="9" text-anchor="end">${new Date(x1).toLocaleDateString('tr-TR',{day:'numeric',month:'short'})}</text>
  </svg>`;
}

/* ---- alerts ---- */
function renderAlerts(){
  const out=[];
  const all=[...entries].sort((a,b)=>new Date(b.time)-new Date(a.time));
  const fh=parseFloat(settings.reminder_feed_hours||'2');
  const lf=all.find(e=>e.type!=='pump');
  if(lf&&hoursSince(lf.time)>=fh) out.push(`Süt vakti — son beslenmeden ${Math.floor(hoursSince(lf.time))} saatten fazla geçti`);
  const ph=parseFloat(settings.reminder_pump_hours||'3');
  const lp=all.find(e=>e.type==='pump');
  if(lp&&hoursSince(lp.time)>=ph) out.push(`Sağma vakti — son sağmadan ${Math.floor(hoursSince(lp.time))} saatten fazla geçti`);
  Object.entries(CARE).forEach(([k,m])=>{
    if(!m.key) return;
    const t=settings[m.key]; if(!t||careToday(k).length) return;
    const [h,mi]=t.split(':').map(Number);
    const d=new Date(); d.setHours(h,mi,0,0);
    if(Date.now()>d.getTime()) out.push(`${m.name} bugün henüz yapılmadı (${t})`);
  });
  $('alerts').innerHTML=out.map(t=>`<div class="alert">⏰ ${esc(t)}</div>`).join('');
}

function renderHeader(){
  const birth=growth.find(x=>x.is_birth);
  const age=birth?babyAge(birth.measured_on):null;
  $('hdrName').textContent=BABY;

  renderHeader(); renderAlerts();
  $('settingsSlot').innerHTML=viewSettings();
  $('content').innerHTML = tab==='feed'?viewFeed():tab==='diaper'?viewDiaper():tab==='care'?viewCare():tab==='growth'?viewGrowth():viewVaccine();

/* ---- events ---- */
document.addEventListener('change', async ev=>{
  const t=ev.target.closest('[data-a="setTime"]');
  if(!t) return;
  await supabase.from('settings').upsert({key:t.dataset.key,value:t.value},{onConflict:'key'});
});
document.addEventListener('click', async ev=>{
  const b=ev.target.closest('[data-a]');
  if(!b) return;
  const a=b.dataset.a;
  if(a==='setTime') return;

  if(a==='theme'){ applyTheme(b.dataset.v); render(); return; }
  if(a==='setIv'){
    await supabase.from('settings').upsert({key:b.dataset.key,value:b.dataset.v},{onConflict:'key'});
    settings[b.dataset.key]=b.dataset.v; render(); return;
  }
  if(a==='closeSettings'){ showSettings=false; render(); return; }

  if(a==='prev'||a==='next'){
    const s=b.dataset.s,d=new Date(dsel[s]+'T00:00:00');
    d.setDate(d.getDate()+(a==='next'?1:-1)); dsel[s]=fmtDate(d);
  }
  else if(a==='today'){ dsel[b.dataset.s]=today(); }
  else if(a==='newFeed'){ panel={s:'feed',t:b.dataset.t,id:null}; }
  else if(a==='pickFeedType'){ panel={...panel,t:b.dataset.t}; }
  else if(a==='editFeed'){ const e=entries.find(x=>x.id===b.dataset.id); panel={s:'feed',t:e.type,id:e.id,side:e.side||null}; }
  else if(a==='delFeed'){ await supabase.from('entries').delete().eq('id',b.dataset.id); panel=null; }
  else if(a==='saveFeed'){
    const amt=parseFloat($('fAmt').value);
    if(!amt||amt<=0){ $('fAmt').style.borderColor='var(--danger)'; return; }
    const iso=combineDT(dsel.feed, $('fTime').value);
    const side = SIDE_TYPES.includes(panel.t) ? (panel.side!==undefined?panel.side:null) : null;
    const row={type:panel.t,amount:amt,time:iso,side:side||null};
    if(panel.id) await supabase.from('entries').update(row).eq('id',panel.id);
    else await supabase.from('entries').insert(row);
    panel=null;
  }
  else if(a==='quickDiaper'){ await supabase.from('diapers').insert({kind:b.dataset.k,time:new Date().toISOString()}); dsel.diaper=today(); }
  else if(a==='editDiaper'){ const d=diapers.find(x=>x.id===b.dataset.id); panel={s:'diaper',k:d.kind,id:d.id}; }
  else if(a==='pickDiaperKind'){ panel={...panel,k:b.dataset.k}; }
  else if(a==='delDiaper'){ await supabase.from('diapers').delete().eq('id',b.dataset.id); panel=null; }
  else if(a==='saveDiaper'){
    const iso=combineDT(dsel.diaper, $('dTime').value);
    await supabase.from('diapers').update({kind:panel.k,time:iso}).eq('id',panel.id);
    panel=null;
  }
  else if(a==='logCare'){ await supabase.from('care_logs').insert({kind:b.dataset.k,time:new Date().toISOString()}); }
  else if(a==='undoCare'||a==='delCare'){ await supabase.from('care_logs').delete().eq('id',b.dataset.id); }
  else if(a==='newGrowth'){ panel={s:'growth',id:null,birth:!growth.some(x=>x.is_birth)}; }
  else if(a==='editGrowth'){ panel={s:'growth',id:b.dataset.id}; }
  else if(a==='toggleBirth'){
    if(panel.id){ const x=growth.find(y=>y.id===panel.id); x.is_birth=!x.is_birth; }
    else panel={...panel,birth:!panel.birth};
  }
  else if(a==='delGrowth'){ await supabase.from('growth').delete().eq('id',b.dataset.id); panel=null; }
  else if(a==='saveGrowth'){
    const gv=$('gW').value?parseFloat($('gW').value):null;
    const h=$('gH').value?parseFloat($('gH').value):null;
    const d=$('gD').value;
    if(gv===null&&h===null){ $('gW').style.borderColor='var(--danger)'; return; }
    const ed=panel.id?growth.find(x=>x.id===panel.id):null;
    const row={weight_kg:gv!=null?gv/1000:null,height_cm:h,measured_on:d,is_birth:ed?ed.is_birth:!!panel.birth};
    if(panel.id) await supabase.from('growth').update(row).eq('id',panel.id);
    else await supabase.from('growth').insert(row);
    panel=null;
  }
  else if(a==='careCog'){ carePanel = carePanel===b.dataset.k?null:b.dataset.k; }
  else if(a==='setDose'){
    const k=b.dataset.k, key='care_'+k+'_perday';
    await supabase.from('settings').upsert({key,value:b.dataset.v},{onConflict:'key'});
    settings[key]=b.dataset.v;
  }
  else if(a==='setCareIv'){
    const k=b.dataset.k, key='care_'+k+'_interval';
    await supabase.from('settings').upsert({key,value:b.dataset.v},{onConflict:'key'});
    settings[key]=b.dataset.v;
  }
  else if(a==='rangePreset'){
    $('rFrom').value=addDays(today(),-(Number(b.dataset.v)-1)); $('rTo').value=today(); return;
  }
  else if(a==='makeReport'){ openReport(); return; }
  else if(a==='pickSide'){ panel={...panel, side:b.dataset.v||null}; }
  else if(a==='markVaccine'){ panel={s:'vaccine',code:b.dataset.code,dose:Number(b.dataset.dose),date:today()}; }
  else if(a==='saveVaccine'){
    await supabase.from('vaccines').upsert({code:panel.code,dose:panel.dose,given_on:$('vDate').value},{onConflict:'code,dose'});
    panel=null;
  }
  else if(a==='undoVaccine'){
    await supabase.from('vaccines').delete().eq('code',b.dataset.code).eq('dose',Number(b.dataset.dose));
  }
  else if(a==='close'){ panel=null; }
  else return;
  render();
});

document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{ tab=b.dataset.tab; panel=null; render(); }));
$('themeBtn').addEventListener('click',()=>{
  applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'); render();
});
$('setBtn').addEventListener('click',()=>{ showSettings=!showSettings; render(); });
$('exportBtn').addEventListener('click',()=>{
  const blob=new Blob([JSON.stringify({baby:BABY,exported_at:new Date().toISOString(),entries,diapers,careLogs,growth,vaccines,settings},null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download=`alp-takip-yedek-${today()}.json`;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
});

/* ---- push ---- */
function b64ToU8(s){
  const p='='.repeat((4-s.length%4)%4), bb=(s+p).replace(/-/g,'+').replace(/_/g,'/');
  const raw=atob(bb), out=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) out[i]=raw.charCodeAt(i);
  return out;
}
async function setupPush(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)) return;
  try{
    const reg=await navigator.serviceWorker.register('sw.js');
    if(Notification.permission==='default') await Notification.requestPermission();
    if(Notification.permission!=='granted') return;
    let sub=await reg.pushManager.getSubscription();
    if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToU8(VAPID_PUBLIC_KEY)});
    const j=sub.toJSON();
    await supabase.from('push_subscriptions').upsert({endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth},{onConflict:'endpoint'});
  }catch(e){ console.error('push',e); }
}

/* ---- data ---- */
async function refetch(){
  const [a,b,c,d,e,v]=await Promise.all([
    supabase.from('entries').select('*').order('time',{ascending:false}),
    supabase.from('diapers').select('*').order('time',{ascending:false}),
    supabase.from('care_logs').select('*').order('time',{ascending:false}),
    supabase.from('growth').select('*').order('measured_on',{ascending:false}),
    supabase.from('settings').select('*'),
    supabase.from('vaccines').select('*'),
  ]);
  if(!a.error) entries=a.data.map(x=>({...x,amount:Number(x.amount)}));
  if(!b.error) diapers=b.data;
  if(!c.error) careLogs=c.data;
  if(!d.error) growth=d.data.map(x=>({...x,weight_kg:x.weight_kg!=null?Number(x.weight_kg):null,height_cm:x.height_cm!=null?Number(x.height_cm):null}));
  if(!e.error){ settings={}; e.data.forEach(r=>settings[r.key]=r.value); }
  if(!v.error) vaccines=v.data;
  render();
}
function showLogin(){ document.title='Bebek Takip'; $('loginScreen').style.display='flex'; $('appScreen').style.display='none'; $('tabs').style.display='none'; }
function showApp(){ document.title=BABY+' · Bebek Takip'; $('loginScreen').style.display='none'; $('appScreen').style.display='block'; $('tabs').style.display='flex'; }
async function start(){
  await refetch();
  $('conn').classList.remove('off');
  setupPush();
  ['entries','diapers','care_logs','growth','settings','vaccines'].forEach(t=>
    supabase.channel(t+'-ch').on('postgres_changes',{event:'*',schema:'public',table:t},refetch).subscribe());
  setInterval(render,30000);
}
supabase=createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
supabase.auth.getSession().then(({data})=>{ if(data.session){ showApp(); start(); } else showLogin(); });
$('loginBtn').addEventListener('click',async()=>{
  const {error}=await supabase.auth.signInWithPassword({email:LOGIN_EMAIL,password:$('pinInput').value});
  if(error){ $('loginErr').textContent='Şifre yanlış, tekrar deneyin.'; return; }
  $('loginErr').textContent=''; showApp(); start();
});
$('pinInput').addEventListener('keydown',e=>{ if(e.key==='Enter') $('loginBtn').click(); });
</script>
